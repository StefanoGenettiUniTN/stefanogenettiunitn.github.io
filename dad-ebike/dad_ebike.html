<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Electric bike savings tracker</title>
<style>
  /* ============================================= */
  /*  EDIT THESE TWO NUMBERS TO UPDATE THE TRACKER  */
  /* ============================================= */
  /*  Also edit the numbers marked EDIT ME below in
      the <script> section near the bottom of the file. */

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f4f3ef;
    margin: 0;
    padding: 60px 20px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    padding: 56px;
    max-width: 760px;
    width: 100%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 34px;
    font-weight: 600;
    margin: 0 0 40px;
    text-align: center;
    color: #1a1a1a;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin-bottom: 40px;
  }
  .stat {
    background: #f4f3ef;
    border-radius: 16px;
    padding: 28px 12px;
    text-align: center;
  }
  .stat.remaining {
    background: #e6f1fb;
  }
  .stat-label {
    font-size: 18px;
    color: #6b6a66;
    margin: 0 0 10px;
  }
  .stat.remaining .stat-label {
    color: #185fa5;
  }
  .stat-value {
    font-size: 36px;
    font-weight: 600;
    margin: 0;
    color: #1a1a1a;
  }
  .stat.remaining .stat-value {
    color: #185fa5;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .bar-track {
    flex: 1;
    height: 28px;
    background: #eceae3;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid #e0ded6;
  }
  .bar-fill {
    height: 100%;
    background: #378ADD;
    border-radius: 999px 0 0 999px;
    transition: width 0.4s ease;
  }
  .bar-pct {
    font-size: 24px;
    font-weight: 600;
    min-width: 72px;
    text-align: right;
    color: #1a1a1a;
  }

  @media (max-width: 600px) {
    body {
      padding: 24px 12px;
    }
    .card {
      padding: 28px 20px;
      border-radius: 16px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 24px;
    }
    .stats {
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }
    .stat-label {
      margin: 0;
      font-size: 16px;
    }
    .stat-value {
      font-size: 24px;
    }
    .bar-row {
      gap: 12px;
    }
    .bar-track {
      height: 20px;
    }
    .bar-pct {
      font-size: 18px;
      min-width: 52px;
    }
  }
</style>
</head>
<body>

<div class="card">
  <h1>Bicicletta elettrica</h1>

  <div class="stats">
    <div class="stat">
      <p class="stat-label">Risparmiato</p>
      <p class="stat-value" id="savedDisplay">€100</p>
    </div>
    <div class="stat">
      <p class="stat-label">Obiettivo</p>
      <p class="stat-value" id="goalDisplay">€4,000</p>
    </div>
    <div class="stat remaining">
      <p class="stat-label">Quanto manca?</p>
      <p class="stat-value" id="remainingDisplay">€3,900</p>
    </div>
  </div>

  <div class="bar-row">
    <div class="bar-track">
      <div class="bar-fill" id="barFill" style="width: 0%;"></div>
    </div>
    <span class="bar-pct" id="pctDisplay">0%</span>
  </div>
</div>

<script>
  // =========================================
  //   EDIT ME: update these two numbers only
  // =========================================
  const saved = 100;   // <-- how much money has been saved so far (euros)
  const goal  = 4000;  // <-- total goal (euros)
  // =========================================

  const remaining = Math.max(goal - saved, 0);
  const pct = Math.min((saved / goal) * 100, 100);

  const fmt = (n) => "€" + n.toLocaleString("en-US");

  document.getElementById("savedDisplay").textContent = fmt(saved);
  document.getElementById("goalDisplay").textContent = fmt(goal);
  document.getElementById("remainingDisplay").textContent = fmt(remaining);
  document.getElementById("pctDisplay").textContent = Math.round(pct) + "%";
  document.getElementById("barFill").style.width = Math.max(pct, pct > 0 ? 2.5 : 0) + "%";
</script>

</body>
</html>
